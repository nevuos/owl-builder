name: Build OWL for MT7621 (MIPS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/openwrt/sdk:ramips-mt7621-23.05.3
      options: --user root
    steps:
      - name: Instalar dependencias no SDK
        run: |
          cd /builder
          ./scripts/feeds update base packages
          ./scripts/feeds install libnl-tiny libpcap libev
          make defconfig
          make package/libnl-tiny/compile -j$(nproc)
          make package/libpcap/compile -j$(nproc)
          make package/libev/compile -j$(nproc)

      - name: Clonar código-fonte do OWL
        run: |
          git clone --recursive https://github.com/seemoo-lab/owl.git /builder/owl

      - name: Compilar OWL para MIPS
        run: |
          set -e
          cd /builder
          export STAGING_DIR_TARGET=$(ls -d /builder/staging_dir/target-mipsel_24kc_musl*)
          export TOOLCHAIN_DIR=$(ls -d /builder/staging_dir/toolchain-mipsel_24kc_gcc*)
          export PATH="/builder/staging_dir/host/bin:$TOOLCHAIN_DIR/bin:$PATH"
          export STAGING_DIR=/builder/staging_dir

          # libnl-tiny substitui libnl-3 e libnl-genl-3 no OpenWrt
          LIBDIR="$STAGING_DIR_TARGET/usr/lib"
          INCDIR="$STAGING_DIR_TARGET/usr/include"
          ls "$LIBDIR" | grep -E "nl|pcap|ev" || true
          ln -sf libnl-tiny.so "$LIBDIR/libnl-3.so"
          ln -sf libnl-tiny.so "$LIBDIR/libnl-genl-3.so"
          ln -sfn libnl-tiny "$INCDIR/libnl3"

          cd /builder/owl
          rm -rf build && mkdir build && cd build

          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=mips \
            -DCMAKE_C_COMPILER=mipsel-openwrt-linux-musl-gcc \
            -DCMAKE_CXX_COMPILER=mipsel-openwrt-linux-musl-g++ \
            -DCMAKE_FIND_ROOT_PATH="$STAGING_DIR_TARGET" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_LIBRARY_PATH="$LIBDIR" \
            -DCMAKE_INCLUDE_PATH="$INCDIR;$INCDIR/libnl-tiny" \
            -DCMAKE_C_FLAGS="-I$INCDIR -I$INCDIR/libnl-tiny" \
            -DCMAKE_CXX_FLAGS="-I$INCDIR -I$INCDIR/libnl-tiny" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$LIBDIR" \
            -Dnl_LIBRARY="$LIBDIR/libnl-tiny.so" \
            -Dnl_genl_LIBRARY="$LIBDIR/libnl-tiny.so" \
            -Dnl_INCLUDE_DIR="$INCDIR/libnl-tiny"

          make owl -j$(nproc)

          OWL_BIN=$(find /builder/owl/build -type f -name owl -perm -u+x | head -n1)
          echo "Binário: $OWL_BIN"
          mipsel-openwrt-linux-musl-strip "$OWL_BIN"
          mkdir -p /builder/out
          cp "$OWL_BIN" /builder/out/owl
          file /builder/out/owl || true

      - name: Publicar Binario Pronto
        uses: actions/upload-artifact@v4
        with:
          name: owl-mt7621-mips
          path: /builder/out/owl
